plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.qtrade'
    compileSdk 34

    defaultConfig {
        applicationId "com.qtrade"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        buildFeatures {
            viewBinding true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        abortOnError false
    }
}

// ---------------------------------------------------------------- Chaquopy
chaquopy {
    build {
        python {
            version = "3.10"
        }
        pip {
            install "numpy"
            install "pandas==2.1.3"
            install "scipy"
            install "scikit-learn==1.3.2"
            install "requests"
            install "beautifulsoup4"
        }
    }
    python {
        // 打包整个 Python 源目录（含 akshare stub、web 前端）
        buildDir = "src/main/python"
    }
    // akshare 在安卓无官方轮子，用本地 stub 顶位（位于 src/main/python/akshare）
    android {
        allowBackup true
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24"
}
